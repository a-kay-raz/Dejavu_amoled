name: Debug app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space for the Mozilla build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4
        with:
          # Artifact builds find a Mozilla-built Gecko artifact by walking back
          # through git history to a mozilla-central push. A shallow checkout
          # leaves only the fork head as a candidate, which has no artifacts,
          # so the full history is required here.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Bootstrap the Mozilla build tools in artifact mode
        run: ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Write the arm64 artifact mozconfig
        run: |
          cat > mozconfig <<'EOF'
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64-linux-android
          ac_add_options --enable-artifact-builds
          mk_add_options MOZ_OBJDIR=./objdir-frontend
          EOF

      - name: Build the app
        run: ./mach build

      - name: Assemble the debug APK
        run: ./mach gradle :fenix:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-apk
          path: objdir-frontend/gradle/build/mobile/android/fenix/app/outputs/apk/debug/fenix-arm64-v8a-debug.apk
          if-no-files-found: error
