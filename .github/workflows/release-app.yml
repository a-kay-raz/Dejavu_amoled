name: Release app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space for the Mozilla build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4
        with:
          # Artifact builds find a Mozilla-built Gecko artifact by walking back
          # through git history to a mozilla-central push. A shallow checkout
          # leaves only the fork head as a candidate, which has no artifacts,
          # so the full history is required here.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Bootstrap the Mozilla build tools in artifact mode
        run: ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Write the arm64 artifact mozconfig
        run: |
          cat > mozconfig <<'EOF'
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64-linux-android
          ac_add_options --enable-artifact-builds
          mk_add_options MOZ_OBJDIR=./objdir-frontend
          EOF

      - name: Build the app
        run: ./mach build

      - name: Assemble the release APK
        run: ./mach gradle :fenix:assembleRelease

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls objdir-frontend/gradle/build/mobile/android/fenix/app/outputs/apk/release/*.apk | head -n 1)
          test -n "$APK" || { echo "No release APK found"; exit 1; }
          ls -lh "$APK"
          sha256sum "$APK"
          cat > /tmp/release-notes.md <<'NOTES_EOF'
          Dejavu release APK, arm64 only, built from main.
          App id: com.byarchitect.dejavu (release id, not the debug id org.mozilla.fenix.debug,
          so this installs as a separate app from the debug build).
          Signing: debug-signed by Gradle (no release keystore is configured in this repo),
          not a release-key signed APK. If the official Dejavu release with the same app id
          is already installed, uninstall it first, or the install will fail on a signature mismatch.
          This release contains the latest pushed commits on main at dispatch time.
          NOTES_EOF
          gh release create "release-${{ github.run_number }}" "$APK" \
            --title "Dejavu Release ${{ github.run_number }}" \
            --notes-file /tmp/release-notes.md
