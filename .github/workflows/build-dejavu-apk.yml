name: Build Dejavu AMOLED APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-dejavu-apk.yml'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant to compile'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'

concurrency:
  group: build-dejavu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-dejavu-apk:
    name: Build Dejavu AMOLED Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space & setup swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          SWAP_DIR=$( [ -d /mnt ] && echo /mnt || echo / )
          sudo fallocate -l 8G $SWAP_DIR/dejavu-swap || true
          sudo chmod 600 $SWAP_DIR/dejavu-swap || true
          sudo mkswap $SWAP_DIR/dejavu-swap || true
          sudo swapon $SWAP_DIR/dejavu-swap || true
          free -h
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          cmdline=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using sdkmanager: $cmdline"
          yes | "$cmdline" --licenses || true

      - name: Prepare Mach Environment & Build Stubs
        run: |
          # Populate obj directories so mozconfig and getBuildId always succeed
          for obj in obj-x86_64-pc-linux-gnu obj-android; do
            mkdir -p "$obj"
            echo '#define MOZ_BUILDID 20261023120000' > "$obj/buildid.h"
            echo '#define MOZ_SOURCE_STAMP '${{ github.sha }} > "$obj/source-repo.h"
            cat << 'OBJEOF' > "$obj/config.status.json"
{
  "topobjdir": "OBJ_DIR_PLACEHOLDER",
  "topsrcdir": "SRC_DIR_PLACEHOLDER",
  "substs": {
    "MOZ_BUILD_APP": "mobile/android",
    "MOZILLA_OFFICIAL": false,
    "MOZ_AUTOMATION": "",
    "MOZ_INCLUDE_SOURCE_INFO": false,
    "MOZ_GOOGLE_SAFEBROWSING_API_KEY": "no-google-safebrowsing-api-key",
    "MOZ_ANDROID_DEBUGGABLE": false,
    "MOZ_ANDROID_FAT_AAR_ARCHITECTURES": "",
    "ANDROID_CPU_ARCH": "arm64-v8a",
    "ANDROID_NDK_MAJOR_VERSION": "26",
    "ANDROID_NDK_MINOR_VERSION": "1",
    "MOZ_APPSERVICES_IN_TREE": false,
    "DOWNLOAD_ALL_GRADLE_DEPENDENCIES": false,
    "ALLOW_INSECURE_GRADLE_REPOSITORIES": false,
    "GRADLE_GLEAN_PARSER_VENV": "",
    "GRADLE_MAVEN_REPOSITORIES": [
      "https://maven.mozilla.org/maven2/",
      "https://plugins.gradle.org/m2/"
    ]
  }
}
OBJEOF
            sed -i "s|OBJ_DIR_PLACEHOLDER|$PWD/$obj|g" "$obj/config.status.json"
            sed -i "s|SRC_DIR_PLACEHOLDER|$PWD|g" "$obj/config.status.json"
          done
          echo "MOZ_BUILD_DATE=20261023120000" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper permissions
        run: |
          chmod +x mobile/android/fenix/gradlew

      - name: Build Dejavu AMOLED APK
        working-directory: mobile/android/fenix
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1g"
          MOZ_BUILD_DATE: "20261023120000"
        run: |
          VARIANT="${{ github.event.inputs.build_variant || 'release' }}"
          echo "=== Starting Dejavu AMOLED APK Build (Variant: $VARIANT) ==="
          if [ "$VARIANT" = "debug" ]; then
            ./gradlew assembleDebug -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --stacktrace --no-daemon
          else
            ./gradlew assembleRelease -PdisableOptimization -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Collect Output APKs
        if: always()
        run: |
          mkdir -p output-apks
          find mobile/android/fenix/app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} output-apks/ \;
          echo "=== Built APKs ==="
          ls -la output-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dejavu-amoled-apks
          path: output-apks/*.apk
          retention-days: 14
